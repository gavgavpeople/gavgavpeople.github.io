<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bella Beauty Salon – Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Helvetica Neue", Arial, sans-serif; color: #3d2c35; background: #fff9fb; line-height: 1.6; }
    .demo-bar { background: #222; color: #fff; text-align: center; padding: 8px; font-size: 0.85rem; }
    .demo-bar a { color: #f7b8d2; }
    header { background: linear-gradient(135deg, #e8a0bf, #ba90c6); color: #fff; text-align: center; padding: 80px 20px; }
    header h1 { font-size: 2.5rem; letter-spacing: 2px; }
    section { max-width: 800px; margin: 40px auto; padding: 0 20px; }
    h2 { margin-bottom: 16px; color: #9b4f7a; }
    .prices { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
    .price-card { background: #fff; padding: 20px; border-radius: 12px; text-align: center;
                  box-shadow: 0 2px 10px rgba(155,79,122,0.12); }
    .price-card strong { display: block; font-size: 1.4rem; color: #9b4f7a; margin-top: 6px; }
    form { display: grid; gap: 12px; }
    input, select, button { padding: 12px; font-size: 1rem; border: 1px solid #e3c4d4; border-radius: 8px; }
    button { background: #9b4f7a; color: #fff; border: none; cursor: pointer; }
    footer { text-align: center; padding: 30px; color: #a0849a; }
  </style>
</head>
<body>

  <div class="demo-bar">Demo website by Kateryna Tarasiuk · <a href="../">Back to my site</a></div>

  <header>
    <h1>✨ Bella Beauty</h1>
    <p>Hair · Nails · Brows — your local London salon</p>
  </header>

  <section>
    <h2>Prices</h2>
    <div class="prices">
      <div class="price-card">Women's cut & blow-dry<strong>£45</strong></div>
      <div class="price-card">Gel manicure<strong>£28</strong></div>
      <div class="price-card">Brow shape & tint<strong>£20</strong></div>
    </div>
  </section>

  <section>
    <h2>Book an appointment</h2>
    <form onsubmit="alert('Demo only – on a real site this appointment would be saved to a database.'); return false;">
      <input type="text" placeholder="Your name" required>
      <input type="tel" placeholder="Phone number" required>
      <select required>
        <option value="">Choose a service</option>
        <option>Cut & blow-dry</option>
        <option>Gel manicure</option>
        <option>Brow shape & tint</option>
      </select>
      <input type="date" required>
      <input type="time" min="09:00" max="19:00" required>
      <button type="submit">Book now</button>
    </form>
  </section>

  <footer>Open Tue–Sun, 9am–7pm · 45 Park Road, London</footer>
